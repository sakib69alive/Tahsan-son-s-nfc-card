<style>
:root{--bg:#D9E0D2;--ink:#243026;--mu:#5E6B5F;--glass:rgba(255,255,255,.62);--glass2:#fff;--line:rgba(36,48,38,.10);--moss:#2C382E;--e:cubic-bezier(.22,1,.36,1);--sans:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Bengali",sans-serif;--serif:"Instrument Serif",Georgia,"Times New Roman",serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);color-scheme:light;-webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior-y:none}
html.lock{overflow:hidden}
html.js-scroll,html.js-scroll body{touch-action:none}
body{margin:0;min-height:100vh;min-height:100dvh;color:var(--ink);font:15px/1.65 var(--sans);-webkit-font-smoothing:antialiased;
background:radial-gradient(70% 38% at 0% 0%,#EFDDEA,transparent 70%),radial-gradient(70% 40% at 100% 62%,#CFDCC8,transparent 70%),var(--bg)}
a,button{font:inherit;color:inherit;text-decoration:none;touch-action:manipulation}
button{cursor:pointer;border:0;background:none}
a:focus-visible,button:focus-visible{outline:2px solid var(--moss);outline-offset:2px}
svg{display:block}
.wrap{position:relative;max-width:440px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 20px calc(env(safe-area-inset-bottom,0px) + 30px)}
.top{display:flex;justify-content:space-between}
.rb{height:42px;min-width:42px;padding:0 15px;display:inline-flex;align-items:center;gap:8px;border-radius:999px;background:var(--glass);border:1px solid var(--line);font-size:13px;font-weight:600}
.rb svg{width:18px;height:18px}
.rb:active{background:var(--glass2)}

.hero{position:relative;width:84%;margin:30px auto 0;padding:12px 12px 16px;background:#FBFBF8;border-radius:6px;transform:rotate(-1.8deg);box-shadow:0 16px 22px -16px rgba(36,48,38,.45),0 1px 4px rgba(36,48,38,.1)}
.tape{position:absolute;top:-14px;left:50%;width:96px;height:28px;margin-left:-48px;background:rgba(203,191,224,.85);transform:rotate(3deg);box-shadow:0 1px 3px rgba(36,48,38,.12)}
.hin{position:relative;aspect-ratio:1/1.1;overflow:hidden;border-radius:2px;background:linear-gradient(160deg,#C9D3C2,#B9A9D0)}
.hin img{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:cover;object-position:50% 40%}
.ini{position:absolute;inset:0;display:grid;place-items:center;font:400 84px var(--serif);color:rgba(255,255,255,.75)}
.who{padding:16px 4px 2px;text-align:center}
h1{margin:0;font:400 clamp(34px,10.4vw,46px)/1.05 var(--serif);letter-spacing:-.01em}
.sub{margin:6px 0 0;color:var(--mu);font-size:13.5px}

.tabs{margin-top:30px;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:999px;background:rgba(255,255,255,.5);border:1px solid var(--line)}
.tabs button{padding:10px 4px;border-radius:999px;font-size:13px;font-weight:600;color:var(--mu);transition:background-color .2s,color .2s}
.tabs button[aria-selected=true]{background:#fff;color:var(--ink);box-shadow:0 2px 8px -3px rgba(36,48,38,.3)}
.desc{margin:16px 6px 0;min-height:108px;color:#3C4A3E;font-size:15.5px}
.desc.sw{animation:sw .3s var(--e)}
@keyframes sw{from{opacity:0}}
.cta{margin-top:10px;width:100%;height:54px;display:flex;align-items:center;justify-content:center;gap:10px;border-radius:999px;background:var(--moss);color:#EEF2E8;font-weight:600;box-shadow:0 8px 14px -10px rgba(36,48,38,.7);transition:transform .12s}
.cta svg{width:20px;height:20px}
.cta:active{transform:scale(.985)}
.quick{margin-top:10px;display:grid;grid-template-columns:repeat(3,1fr);border-radius:22px;background:var(--glass);border:1px solid var(--line);overflow:hidden}
.quick a{display:flex;flex-direction:column;align-items:center;gap:7px;padding:15px 4px 13px;font-size:12.5px;font-weight:600}
.quick a+a{border-left:1px solid var(--line)}
.quick svg{width:22px;height:22px}
.quick a:active{background:var(--glass2)}

h2{margin:34px 4px 12px;font:400 26px/1.1 var(--serif)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;gap:14px;min-width:0;padding:14px;border-radius:22px;background:var(--glass);border:1px solid var(--line);transition:transform .12s,background-color .15s}
.tile:active{transform:scale(.98);background:var(--glass2)}
.ico{width:42px;height:42px;display:grid;place-items:center;border-radius:50%;background:var(--moss);color:#E4EBDB}
.ico svg{width:20px;height:20px}
.tile b{display:block;font-size:14.5px;font-weight:600;line-height:1.25}
.tile small{display:block;margin-top:2px;font-size:12.5px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.off .ico{opacity:.55}
.foot{margin-top:36px;text-align:center;font:400 17px var(--serif);color:var(--mu)}

.ov{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:18px;background:rgba(36,48,38,.55);opacity:0;visibility:hidden;transition:opacity .2s,visibility 0s .2s}
.ov.open{opacity:1;visibility:visible;transition:opacity .2s}
.mod{width:100%;max-width:320px;padding:24px;border-radius:28px;background:#F6F7F2;border:1px solid var(--line);text-align:center;transform:translateY(10px);transition:transform .25s var(--e)}
.ov.open .mod{transform:none}
.mod h3{margin:0;font:400 26px var(--serif)}
.mod p{margin:4px 0 16px;font-size:13px;color:var(--mu)}
#qr{display:inline-block;min-width:184px;min-height:184px;padding:12px;background:#fff;border-radius:18px;margin-bottom:14px;border:1px solid var(--line)}
#qr img,#qr canvas{display:block}
.mod .opt{width:100%;margin-bottom:8px;padding:14px;border-radius:999px;background:#fff;border:1px solid var(--line);font-weight:600;font-size:14px}
.mod .x{width:100%;padding:12px;border-radius:999px;color:var(--mu);font-weight:600}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);z-index:30;transform:translate(-50%,-90px);padding:11px 18px;border-radius:999px;background:var(--moss);color:#EEF2E8;font-size:13px;font-weight:600;transition:transform .3s var(--e);pointer-events:none;white-space:nowrap}
#toast.show{transform:translate(-50%,0)}
@media (max-width:350px){.wrap{padding-left:14px;padding-right:14px}.hero{width:90%}.grid{gap:8px}.tile{padding:12px}}
@media (prefers-reduced-motion:reduce){.desc.sw{animation:none}*{transition-duration:.01ms!important}}
</style>
</head>

    <a id="b-wa" href="#"><svg fill="currentColor" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/></svg>WhatsApp</a>
    <a id="b-mail" href="#"><svg fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>Email</a>
  </nav>

  <h2>Connect</h2>
  <div class="grid" id="g-links"></div>

  <p class="foot">Tahsan Sarker · Digital profile</p>
</main>

<div class="ov" id="qm" onclick="if(event.target===this)closeM('qm')">
  <div class="mod"><h3>Scan to connect</h3><p>Point your camera at the code</p><div id="qr"></div><button class="x" onclick="closeM('qm')">Close</button></div>
</div>
<div class="ov" id="sm" onclick="if(event.target===this)closeM('sm')">

const I = {
  instagram:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>',

const $ = id => document.getElementById(id);
let tt;
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2000)}
function copyText(v,msg){
  const done=()=>toast(msg||'Copied');
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(v).then(done,()=>fb())}else fb();
  function fb(){const a=document.createElement('textarea');a.value=v;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e){}a.remove();done()}
}
let qrDone=false,qrTry=0;
function buildQR(){
  if(qrDone)return;
  if(!window.QRCode){if(qrTry++<25)setTimeout(buildQR,300);return}
  qrDone=true;
  new QRCode($('qr'),{text:location.href,width:160,height:160,colorDark:'#243026',colorLight:'#FFFFFF',correctLevel:QRCode.CorrectLevel.H});
}
const openM=id=>{$(id).classList.add('open');document.documentElement.classList.add('lock');if(id==='qm')buildQR()};
const closeM=id=>{$(id).classList.remove('open');document.documentElement.classList.remove('lock')};
function nativeShare(){navigator.share?navigator.share({title:CONFIG.fullName,url:location.href}).catch(()=>{}):copyText(location.href,'Link copied')}

document.addEventListener('DOMContentLoaded',()=>{
  $('name').textContent=CONFIG.fullName;
  $('ini').textContent=CONFIG.fullName.split(' ').map(w=>w[0]).join('').slice(0,2);

  // photo (built-in compressed copy = fast on low-end phones)
  const img=$('avatar');
  img.onload=()=>{img.hidden=false;$('ini').hidden=true};
  img.onerror=()=>{img.onerror=null;img.src=window.EMBED};
  img.src=CONFIG.avatar||window.EMBED;

  // role tabs
  const tabs=$('tabs'),desc=$('desc');
  CONFIG.roles.forEach((r,i)=>{
    const b=document.createElement('button');b.role='tab';b.textContent=r.label;
    b.onclick=()=>pick(i,true);
    tabs.appendChild(b);
  });
  function pick(i,anim){
    const r=CONFIG.roles[i];
    [...tabs.children].forEach((x,j)=>x.setAttribute('aria-selected',j===i));
    desc.textContent=r.text;desc.classList.remove('sw');
    if(anim){void desc.offsetWidth;desc.classList.add('sw')}
  }
  pick(0,false);

  // quick actions
  const empty=(el,label)=>el.onclick=e=>{e.preventDefault();toast(label+' not added yet')};
  CONFIG.phone?$('b-call').href='tel:'+CONFIG.phone:empty($('b-call'),'Number');
  if(CONFIG.whatsapp){$('b-wa').href='https://wa.me/'+CONFIG.whatsapp;$('b-wa').target='_blank';$('b-wa').rel='noopener'}else empty($('b-wa'),'WhatsApp');
  CONFIG.email?$('b-mail').href='mailto:'+CONFIG.email:empty($('b-mail'),'Email');

  // link tiles
  const build=(items,box)=>items.forEach(l=>{
    const a=document.createElement('a'),has=l.url||l.copy;
    a.className='tile'+(has?'':' off');a.href=l.url||'#';
    if(/^https?:/.test(l.url)){a.target='_blank';a.rel='noopener noreferrer'}
    if(!l.url)a.onclick=e=>{e.preventDefault();l.copy?copyText(l.copy,l.title+' copied'):toast(l.title+' not added yet')};
    a.innerHTML=`<span class="ico">${I[l.id]}</span><span><b>${l.title}</b><small>${l.handle||(l.copy?'Tap to copy':l.url?'Open profile':'Not added yet')}</small></span>`;
    box.appendChild(a);
  });
  build(CONFIG.links,$('g-links'));

});

function saveVCard(){
  const p=CONFIG.fullName.split(' '),urls=CONFIG.links.filter(l=>/^https?:/.test(l.url)).map(l=>'URL:'+l.url);
  const v=['BEGIN:VCARD','VERSION:3.0',`FN:${CONFIG.fullName}`,`N:${p.slice(1).join(' ')};${p[0]};;;`,'TITLE:Student | Entrepreneur | Gamer',
    CONFIG.phone&&`TEL;TYPE=CELL:${CONFIG.phone}`,CONFIG.email&&`EMAIL:${CONFIG.email}`,...urls,'END:VCARD'].filter(Boolean).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([v],{type:'text/vcard'}));a.download=CONFIG.fullName.replace(/\s+/g,'_')+'.vcf';
  document.body.appendChild(a);a.click();a.remove();toast('Contact saved');
}

<script>
/* ===== heavy-glide scroll: halka dhakka dile ball er moto kichukkhon egiye jay ===== */
(function(){
  if(!CONFIG.heavyScroll||matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const root=document.documentElement,se=document.scrollingElement||root;
  const FRICTION=.945,MIN_V=.012,MAX_V=3.5,WHEEL_EASE=120;
  let pos=se.scrollTop,vel=0,target=0,raf=0,prev=0,mode='idle';
  let touching=false,dragged=false,sy=0,ly=0,vs=[],dragEnd=-1e9;
  const maxY=()=>Math.max(0,se.scrollHeight-innerHeight);
  const locked=()=>root.classList.contains('lock');
  const set=y=>{const m=maxY();pos=y<0?0:y>m?m:y;se.scrollTop=pos};
  function tick(t){
    const dt=Math.min(40,t-prev);prev=t;
    if(mode==='glide'){
      set(pos+vel*dt);
      vel*=Math.pow(FRICTION,dt/16.667);
      if(Math.abs(vel)<MIN_V||(pos<=0&&vel<0)||(pos>=maxY()&&vel>0)){mode='idle';vel=0}
    }else if(mode==='wheel'){
      set(pos+(target-pos)*(1-Math.exp(-dt/WHEEL_EASE)));
      if(Math.abs(target-pos)<.5){set(target);mode='idle'}
    }
    raf=(mode==='glide'||mode==='wheel')?requestAnimationFrame(tick):0;
  }
  function run(m){mode=m;prev=performance.now();if(!raf)raf=requestAnimationFrame(tick)}

  addEventListener('touchstart',e=>{
    if(locked()||e.touches.length>1){touching=false;return}
    mode='idle';vel=0;pos=se.scrollTop;            // angul diye ball thamano
    sy=ly=e.touches[0].clientY;dragged=false;touching=true;
    vs=[{y:sy,t:e.timeStamp}];
  },{passive:true});
  addEventListener('touchmove',e=>{
    if(!touching)return;
    const y=e.touches[0].clientY;
    if(!dragged){if(Math.abs(y-sy)<8)return;dragged=true;ly=y}
    if(e.cancelable)e.preventDefault();
    set(pos+(ly-y));ly=y;
    vs.push({y,t:e.timeStamp});
    while(vs.length>2&&e.timeStamp-vs[0].t>100)vs.shift();
  },{passive:false});
  function endTouch(e){
    if(!touching)return;touching=false;
    if(!dragged)return;
    dragEnd=performance.now();
    const a=vs[0],b=vs[vs.length-1],dt=b.t-a.t;
    let v=0;
    if(dt>0&&e.timeStamp-b.t<80)v=(a.y-b.y)/dt;
    v=Math.max(-MAX_V,Math.min(MAX_V,v));
    if(Math.abs(v)>.08){vel=v;run('glide')}
  }
  addEventListener('touchend',endTouch,{passive:true});
  addEventListener('touchcancel',endTouch,{passive:true});
  addEventListener('click',e=>{if(performance.now()-dragEnd<350){e.preventDefault();e.stopPropagation()}},true);

  addEventListener('wheel',e=>{
    if(locked()||e.ctrlKey)return;
    e.preventDefault();
    if(mode!=='wheel'){pos=se.scrollTop;target=pos}
    const d=e.deltaMode===1?e.deltaY*32:e.deltaMode===2?e.deltaY*innerHeight:e.deltaY;
    target=Math.max(0,Math.min(maxY(),target+d));
    run('wheel');
  },{passive:false});

  addEventListener('scroll',()=>{if(mode==='idle'&&!touching)pos=se.scrollTop},{passive:true});
  addEventListener('resize',()=>{set(pos)});
  root.classList.add('js-scroll');
})();
</script>
